<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.png">
<title>xingyen</title>
<meta name="description" content="xingyen 的專案列表。">
<style>
  :root {
    --bg: #ffffff;
    --surface: #f4f9fe;
    --border: #d9e4ef;
    --text: #1f2d3d;
    --muted: #5b7085;
    --accent: #2f6fa8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC",
                 "PingFang TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.75;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 720px; margin: 0 auto; padding: 72px 0; }
  h1 { font-size: 1.6rem; margin: 0 0 8px; }
  .tagline { color: var(--muted); margin: 0 0 40px; }
  .project {
    display: block;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 22px;
    margin-bottom: 14px;
    text-decoration: none;
    color: inherit;
  }
  .project:hover { border-color: var(--accent); }
  .project h2 { font-size: 1.15rem; margin: 0 0 6px; color: var(--accent); }
  .project p { margin: 0; color: var(--muted); font-size: 0.96rem; }
  footer {
    margin-top: 48px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.92rem;
  }
  a { color: var(--accent); }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141a20;
      --surface: #1c242d;
      --border: #2d3944;
      --text: #e8eef4;
      --muted: #9fb0c0;
      --accent: #7fb6e6;
    }
  }
</style>
</head>
<body>
<main>
  <h1>xingyen</h1>
  <p class="tagline">目前進行中的專案。</p>

  <a class="project" href="/officehub/">
    <h2>OfficeHub</h2>
    <p>把工地的文書工作留在工地做完。給營建現場的 Android 應用程式。</p>
  </a>

  <footer>
    <a href="mailto:xingyen0613@gmail.com">xingyen0613@gmail.com</a>
  </footer>
</main>
</body>
</html>
