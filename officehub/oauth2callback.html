<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.png">
<title>返回 OfficeHub</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #ffffff;
    --surface: #f4f9fe;
    --border: #d9e4ef;
    --text: #1f2d3d;
    --muted: #5b7085;
    --accent: #2f6fa8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC",
                 "PingFang TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.75;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 560px; margin: 0 auto; padding: 72px 0; }
  h1 { font-size: 1.4rem; margin: 0 0 12px; }
  p { margin: 0 0 14px; color: var(--muted); }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    margin-top: 24px;
  }
  .label { font-size: 0.85rem; color: var(--muted); margin: 0 0 6px; }
  code {
    display: block;
    font-size: 0.8rem;
    word-break: break-all;
    color: var(--text);
    line-height: 1.6;
  }
</style>
</head>
<body>
<main>
  <h1>可以關閉這個分頁了</h1>
  <p>已經挑選完畢，請關閉瀏覽器分頁回到 OfficeHub。</p>
  <p>看得到這一頁，表示 App 沒有攔截這個網址——通常是應用程式連結尚未驗證完成。</p>
  <div class="card" id="detail" hidden>
    <p class="label">挑選到的檔案</p>
    <code id="ids"></code>
  </div>
</main>
<script>
  var ids = new URLSearchParams(location.search).get('picked_file_ids');
  if (ids) {
    document.getElementById('ids').textContent = ids.split(',').join('\n');
    document.getElementById('detail').hidden = false;
  }
</script>
</body>
</html>
